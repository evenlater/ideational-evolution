backend:
  name: git-gateway
  branch: main

media_folder: static/images
public_folder: /images

site_url: https://www.ideationalevolution.com

collections:

  # ── ESSAYS ──────────────────────────────────────────────────────
  - name: posts
    label: Essays
    label_singular: Essay
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string, required: false,
          hint: "Italic subheading shown below the title" }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        options:
          - Gladstone
          - Disraeli
          - Wilson
          - Bulwer-Lytton
          - Gore Vidal
          - Victorian
          - Literary History
          - Political History
      - { label: Opening Epigraph / Lede, name: lede, widget: text,
          required: false,
          hint: "Appears in italic with gold left-border, both on homepage and at top of post" }
      - { label: Body, name: body, widget: markdown }
      - label: Bibliography
        name: sources
        widget: list
        required: false
        hint: "Enter book IDs from the Books library below. The bibliography renders automatically."
        field: { label: Book ID, name: bookID, widget: relation,
                  collection: books, search_fields: [id, title, author],
                  value_field: id, display_fields: [title, author] }

  # ── BOOKS LIBRARY ───────────────────────────────────────────────
  - name: books
    label: Books Library
    label_singular: Book
    files:
      - name: books
        label: All Books
        file: data/books.yaml
        fields:
          - label: Books
            name: books
            widget: list
            fields:
              - { label: ID, name: id, widget: string,
                  hint: "Short unique key e.g. mitchell_bulwer or bebbington_gladstone" }
              - { label: Author, name: author, widget: string,
                  hint: "Last, First format e.g. Mitchell, Leslie" }
              - { label: Title, name: title, widget: string }
              - { label: Publisher, name: publisher, widget: string }
              - { label: Year, name: year, widget: number }
              - { label: City, name: city, widget: string, required: false }
              - { label: Edition / Series, name: edition, widget: string,
                  required: false }
              - { label: ISBN, name: isbn, widget: string, required: false }
              - { label: Notes, name: notes, widget: text, required: false,
                  hint: "Internal notes — not shown on site" }
