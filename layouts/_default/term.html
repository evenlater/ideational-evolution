{{ define "main" }}
<div class="container">
  <div class="posts-section">
    <div class="posts-header"><h3>Tagged: {{ .Title | markdownify }}</h3></div>
    <div class="post-grid">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
